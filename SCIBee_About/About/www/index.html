<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>About SCIBee</title>

    <style>
      /* ---------- Global ---------- */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        line-height: 1.5;

        margin: 0;
        padding: 16px;

        background: #f5f5f5;
        color: #000;
      }

      /* ---------- Layout ---------- */

      .container {
        max-width: 900px;
        margin: auto;

        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ---------- Header ---------- */

      header {
        display: flex;
        align-items: center;
      }

      header img {
        height: 50px;
        margin-top: 6px;
        margin-right: 12px;
      }

      header h1 {
        margin: 0;

        font-size: 30px;
        font-weight: bold;
        line-height: 1.2;
      }

      /* ---------- Status ---------- */

      .status-bar {
        margin-top: 8px;

        font-size: 16px;
        text-align: center;
      }

      /* ---------- Buttons ---------- */

      button {
        width: 180px;
        min-height: 44px;

        padding: 12px;
        margin: 12px;

        font-family: inherit;
        font-size: 18px;
        font-weight: bold;
        line-height: 1.2;

        border: none;
        border-radius: 6px;

        background: #ffc73e;
        color: #000;

        cursor: pointer;

        appearance: none;
        -webkit-appearance: none;

        transition: filter 0.15s ease;
      }

      button:hover {
        filter: brightness(0.95);
      }

      button:active {
        filter: brightness(0.9);
      }

      /* ---------- Mobile ---------- */

      @media (max-width: 600px) {
        body {
          padding: 12px;
        }

        header img {
          height: 36px;
        }

        header h1 {
          font-size: 24px;
        }

        button {
          margin: 12px 6px 12px 6px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <a href="./">
          <img src="./logo.png" alt="Logo" />
        </a>
        <h1>About SCIBee</h1>
      </header>
      <div class="status-bar">
        <h2>Smart Community Integrated Beehive</h2>
        <p>A modular mechatronic system for smarter beekeeping.</p>
          <p><strong>Monitor</strong> hive conditions</p>
          <p><strong>Collect</strong> data automatically</p>
          <p><strong>Gain</strong> useful insights</p>
          <p><strong>Adapt</strong> to different needs</p>
          <p><strong>Connect</strong> beekeepers and researchers</p>
          <p><strong>Improve</strong> beekeeping practices</p>
      </div>

      <div class="row">

      </div>
    </div>
    <script>
      window.onload = () => {};
    </script>
  </body>
</html>
