# compose.yml
services:
    caddy:
        image: caddy:latest
        container_name: caddy
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
        depends_on:
            - about

    about:
        build: ../About
        container_name: about
        restart: unless-stopped
        volumes:
            - ../About:/About

    synchroniser:
        build: ../Synchroniser
        container_name: synchroniser
        restart: unless-stopped
        volumes:
            - ../Synchroniser:/Synchroniser

    presenter:
        build: ../Presenter
        container_name: presenter
        restart: unless-stopped
        volumes:
            - ../Presenter:/Presenter

    community_hub:
        build: ../Community/Hub
        container_name: community_hub
        restart: unless-stopped
        volumes:
            - ../Community/Hub:/Community/Hub

    community_blooming:
        build: ../Community/Blooming
        container_name: community_blooming
        restart: unless-stopped
        volumes:
            - ../Community/Blooming:/Community/Blooming

    community_meadows:
        build: ../Community/Meadows
        container_name: community_meadows
        restart: unless-stopped
        volumes:
            - ../Community/Varroa:/Community/Varroa

    community_varroa:
        build: ../Community/Varroa
        container_name: community_varroa
        restart: unless-stopped
        volumes:
            - ../Community/Varroa:/Community/Varroa

    community_spraying:
        build: ../Community/Spraying
        container_name: community_spraying
        restart: unless-stopped
        volumes:
            - ../Community/Spraying:/Community/Spraying

    gatekeeper_db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: ${GATEKEEPER_DB_NAME}
            MYSQL_USER: ${GATEKEEPER_DB_USER}
            MYSQL_PASSWORD: ${GATEKEEPER_DB_PASS}
            MYSQL_ROOT_PASSWORD: ${GATEKEEPER_DB_PASS}
        healthcheck:
            test: ["CMD-SHELL", "mysql -u${GATEKEEPER_DB_USER} -p${GATEKEEPER_DB_PASS} -e 'SELECT 1' ${GATEKEEPER_DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s
        volumes:
            - gatekeeper_db_data:/var/lib/mysql

    gatekeeper:
        image: ghcr.io/openagri-eu/openagri-gatekeeper:latest
        environment:
            DATABASE_URL: mysql://${GATEKEEPER_DB_USER}:${GATEKEEPER_DB_PASS}@gatekeeper_db:3306/${GATEKEEPER_DB_NAME}
            MAINTENANCE_MODE: ${MAINTENANCE_MODE}
            APP_HOST: ${GATEKEEPER_APP_HOST}
            APP_PORT: ${GATEKEEPER_APP_PORT}
            DJANGO_PORT: ${GATEKEEPER_APP_PORT}
            DJANGO_SECRET_KEY: ${GATEKEEPER_DJANGO_SECRET_KEY}
            SUPERUSER_USERNAME: ${GATEKEEPER_SUPERUSER_USERNAME}
            SUPERUSER_EMAIL: ${GATEKEEPER_SUPERUSER_EMAIL}
            SUPERUSER_PASSWORD: ${GATEKEEPER_SUPERUSER_PASSWORD}
            JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
            JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES}
            JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS}
            FARM_CALENDAR_API: ${GATEKEEPER_FARM_CALENDAR_API}
            FARM_CALENDAR_POST_AUTH: ${GATEKEEPER_FARM_CALENDAR_POST_AUTH}
            EXTRA_ALLOWED_HOSTS: ${EXTRA_ALLOWED_HOSTS}
            NO_PROXY: ${DEFAULT_NO_PROXY},gatekeeper_db
            DJANGO_DEBUG: ${GATEKEEPER_DJANGO_DEBUG}
            INTERNAL_GK_URL: ${INTERNAL_GK_URL}
            DJANGO_STATIC_ROOT: ${GATEKEEPER_DJANGO_STATIC_ROOT}
        depends_on:
            gatekeeper_db:
                condition: service_healthy
        healthcheck:
            test: [ "CMD-SHELL", "curl --fail http://gatekeeper:8001/healthz || exit 1" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        ports:
            - "127.0.0.1:8001:8001"
        volumes:
            - gatekeeper_static:/static
            - gatekeeper_media:/media
            - gatekeeper_assets:/assets

    farmcalendar_db:
        image: postgres:16.3
        environment:
            POSTGRES_DB: ${FARM_CALENDAR_POSTGRES_DB}
            POSTGRES_USER: ${FARM_CALENDAR_POSTGRES_USER}
            POSTGRES_PASSWORD: ${FARM_CALENDAR_POSTGRES_PASSWORD}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $FARM_CALENDAR_POSTGRES_USER -d $FARM_CALENDAR_POSTGRES_DB || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        volumes:
            - farmcalendar_db_data:/var/lib/postgresql/data

    farmcalendar:
        image: ghcr.io/openagri-eu/openagri-farmcalendar:latest
        command: /var/www/entrypoint.sh
        environment:
            APP_HOST: ${FARM_CALENDAR_APP_HOST}
            APP_PORT: ${FARM_CALENDAR_APP_PORT}
            POSTGRES_HOST: farmcalendar_db
            POSTGRES_DB: ${FARM_CALENDAR_POSTGRES_DB}
            POSTGRES_USER: ${FARM_CALENDAR_POSTGRES_USER}
            POSTGRES_PASSWORD: ${FARM_CALENDAR_POSTGRES_PASSWORD}
            DJANGO_SECRET_KEY: ${FARM_CALENDAR_DJANGO_SECRET_KEY}
            LOGGING_LEVEL: ${LOGGING_LEVEL}
            GATEKEEPER_LOGIN_URL: ${GATEKEEPER_LOGIN_URL}
            GATEKEEPER_API_LOGIN_URL: ${GATEKEEPER_LOGIN_API_URL}
            GATEKEEPER_ENDPOINT_REG_URL: ${GATEKEEPER_ENDPOINT_REG_URL}
            REPORTING_API_ROOT: ${FARM_CALENDAR_REPORTING_API_ROOT}
            DISABLE_REPORTING: ${FARM_CALENDAR_DISABLE_REPORTING}
            INTERNAL_SERVICE_NAME: farmcalendar
            FARMCALENDAR_GATEKEEPER_USER: ${GATEKEEPER_SUPERUSER_USERNAME}
            FARMCALENDAR_GATEKEEPER_PASSWORD: ${GATEKEEPER_SUPERUSER_PASSWORD}
            AUTO_CREATE_AUTH_USER: True
            JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
            JWT_COOKIE_NAME: ${JWT_COOKIE_NAME}
            EXTRA_ALLOWED_HOSTS: ${EXTRA_ALLOWED_HOSTS}
            VIRTUAL_HOST: ${FARM_CALENDAR_VIRTUAL_HOST}
            VIRTUAL_PORT: ${FARM_CALENDAR_APP_PORT}
            HTTP_PROXY: ${HTTP_PROXY}
            HTTPS_PROXY: ${HTTPS_PROXY}
            http_proxy: ${HTTP_PROXY}
            https_proxy: ${HTTPS_PROXY}
            NO_PROXY: ${DEFAULT_NO_PROXY},farmcalendar_db
        depends_on:
            farmcalendar_db:
                condition: service_healthy
            gatekeeper:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "--fail", "http://localhost:${FARM_CALENDAR_APP_PORT}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        ports:
            - "127.0.0.1:8002:8002"

    pdm_db:
        image: postgres:16.3
        environment:
            POSTGRES_DB: ${PDM_POSTGRES_DB}
            POSTGRES_USER: ${PDM_POSTGRES_USER}
            POSTGRES_PASSWORD: ${PDM_POSTGRES_PASSWORD}
            PGPORT: ${PDM_POSTGRES_PORT}
        healthcheck:
            test: pg_isready -U ${PDM_POSTGRES_USER} -d ${PDM_POSTGRES_DB}
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
        volumes:
            - pdm_db_data:/var/lib/postgresql/data

    pdm:
        depends_on:
            pdm_db:
                condition: service_healthy
            gatekeeper:
                condition: service_healthy
        image: ghcr.io/openagri-eu/openagri-pestanddiseasemanagement:latest
        command: /code/entrypoint.sh ${PDM_SERVICE_PORT}
        environment:
            POSTGRES_HOST: pdm_db
            POSTGRES_USER: ${PDM_POSTGRES_USER}
            POSTGRES_PASSWORD: ${PDM_POSTGRES_PASSWORD}
            POSTGRES_DB: ${PDM_POSTGRES_DB}
            POSTGRES_PORT: ${PDM_POSTGRES_PORT}
            ACCESS_TOKEN_EXPIRATION_TIME: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
            JWT_KEY: ${JWT_SIGNING_KEY}
            SERVICE_PORT: ${PDM_SERVICE_PORT}
            CORS_ORIGINS: ${PDM_CORS_ORIGINS}
            JWT_ALGORITHM: ${JWT_ALG}
            GATEKEEPER_BASE_URL: ${INTERNAL_GK_URL}
            USING_GATEKEEPER: ${PDM_USING_GATEKEEPER}
            GATEKEEPER_USERNAME: ${GATEKEEPER_SUPERUSER_USERNAME}
            GATEKEEPER_PASSWORD: ${GATEKEEPER_SUPERUSER_PASSWORD}
            SERVICE_NAME: ${PDM_SERVICE_NAME}
            LOGGING: ${LOGGING_LEVEL}
            REFRESH_TOKEN_EXPIRATION_TIME: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
        ports:
            - "127.0.0.1:8003:8003"

    weathersrv_db:
        image: mongo:4
        command: mongod
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${WEATHER_SRV_MONGO_INITDB_ROOT_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${WEATHER_SRV_MONGO_INITDB_ROOT_PASSWORD}
            MONGO_INITDB_DATABASE: ${WEATHER_SRV_MONGO_INITDB_DATABASE}
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: ["CMD", "mongo", "--eval", "db.runCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    weathersrv:
        image: ghcr.io/openagri-eu/openagri-weatherservice:latest
        depends_on:
            weathersrv_db:
                    condition: service_healthy
            gatekeeper:
                    condition: service_healthy
            farmcalendar:
                    condition: service_healthy
        environment:
            # Generic environment vars
            LOGGING_LEVEL: ${LOGGING_LEVEL:-INFO}
            JWT_KEY: ${JWT_SIGNING_KEY}
            ALGORITHM: ${JWT_ALG:-HS256}
            CRYPT_CONTEXT_SCHEME: ${JWT_CRYPT_CONTEXT_SCHEME:-bcrypt}
            ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME:-240}
            # Service specific vars
            WEATHER_SRV_PORT: ${WEATHER_SRV_PORT:-8000}
            WEATHER_SRV_HOSTNAME: ${WEATHER_SRV_HOSTNAME:-weathersrv}
            WEATHER_SRV_DATABASE_URI: ${WEATHER_SRV_DATABASE_URI}
            WEATHER_SRV_DATABASE_NAME: ${WEATHER_SRV_DATABASE_NAME}
            EXTRA_ALLOWED_HOSTS: ${WEATHER_SRV_EXTRA_ALLOWED_HOSTS:-*}
            WEATHER_SRV_OPENWEATHERMAP_API_KEY: ${WEATHER_SRV_OPENWEATHERMAP_API_KEY}
            # If the above value is set then weather service will try to integrate with Gatekeeper
            GATEKEEPER_URL: ${INTERNAL_GK_URL}
            WEATHER_SRV_GATEKEEPER_USER: ${GATEKEEPER_SUPERUSER_USERNAME}
            WEATHER_SRV_GATEKEEPER_PASSWORD: ${GATEKEEPER_SUPERUSER_PASSWORD}
            GATEKEEPER_FARM_CALENDAR_API: ${GATEKEEPER_FARM_CALENDAR_API}
            # FARM CALENDAR
            PUSH_THI_TO_FARMCALENDAR: ${PUSH_THI_TO_FARMCALENDAR}
            PUSH_FLIGHT_FORECAST_TO_FARMCALENDAR: ${PUSH_FLIGHT_FORECAST_TO_FARMCALENDAR}
            PUSH_SPRAY_F_TO_FARMCALENDAR: ${PUSH_SPRAY_F_TO_FARMCALENDAR}
            INTERVAL_THI_TO_FARMCALENDAR: ${INTERVAL_THI_TO_FARMCALENDAR}
        volumes:
            - ./data:/data:rw
        ports:
            - "127.0.0.1:8004:8004"

volumes:
    gatekeeper_db_data:
    gatekeeper_static:
    gatekeeper_media:
    gatekeeper_assets:
    farmcalendar_db_data:
    mongodb_data:
    pdm_db_data:


